<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Forecast WebSocket Status</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            font-family:Arial,sans-serif;
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        #connectionStatus{
            width:250px;
            padding:20px;
            text-align:center;
            font-size:22px;
            font-weight:bold;
            color:white;
            background:red;
            border-radius:10px;
            box-shadow:0 2px 10px rgba(0,0,0,.2);
        }

    </style>

</head>
  

<body>

    <div class="container">

    <h1>ENERGY ANALYTICS DASHBOARD</h1>

    <div id="connectionStatus">
        Connecting...
    </div>

    <br><br>

    <label><b>Select Zone</b></label>

    <select id="zoneSelect">
        <option value="">Select Zone</option>
        <option value="ZONE_01">ZONE_01</option>
        <option value="ZONE_02">ZONE_02</option>
        <option value="ZONE_03">ZONE_03</option>
        <option value="ZONE_04">ZONE_04</option>
        <option value="ZONE_05">ZONE_05</option>
        <option value="ZONE_06">ZONE_06</option>
        <option value="ZONE_07">ZONE_07</option>
        <option value="ZONE_08">ZONE_08</option>
        <option value="ZONE_09">ZONE_09</option>
        <option value="ZONE_10">ZONE_10</option>
    </select>

    <br><br>

    <label><b>Select Forecast Date</b></label>

    <input type="date" id="forecastDate">

    <br><br>

    <button id="generateBtn">
        Generate Forecast
    </button>

    <br><br>

    <table>

        <thead>

        <tr>

            <th>Zone</th>
            <th>Forecast Power</th>
            <th>Max</th>
            <th>Min</th>
            <th>House Count</th>
            <th>Utilization</th>
            <th>Date</th>

        </tr>

        </thead>

        <tbody>

        <tr id="forecastRow">

            <td colspan="7">
                No Forecast Generated
            </td>

        </tr>

        </tbody>

    </table>

    <br><br>

    <canvas
        id="forecastChart"
        width="900"
        height="350">
    </canvas>

</div>


<script>

// -----------------------------
// WebSocket Connection
// -----------------------------

const status = document.getElementById("connectionStatus");

function connectSocket() {

    status.innerHTML = "🟡 Connecting...";
    status.style.background = "orange";

    const socket = new WebSocket("ws://127.0.0.1:8000/ws/forecast");

    socket.onopen = function () {

        console.log("Forecast WebSocket Connected");

        status.innerHTML = "🟢 Connected";
        status.style.background = "green";

    };

    socket.onmessage = function(event){

        console.log("Received:", event.data);

    };

    socket.onerror = function(error){

        console.log("Forecast WebSocket Error");
        console.log(error);

    };

    socket.onclose = function(){

        console.log("Forecast WebSocket Disconnected");

        status.innerHTML = "🔴 Disconnected";
        status.style.background = "red";

        // Auto reconnect after 3 seconds
        setTimeout(connectSocket,3000);

    };

}

// Start WebSocket
connectSocket();


// -----------------------------
// Date Picker (Today → Next 30 Days)
// -----------------------------

const today = new Date();

const maxDate = new Date();

maxDate.setDate(today.getDate() + 30);

document.getElementById("forecastDate").min =
today.toISOString().split("T")[0];

document.getElementById("forecastDate").max =
maxDate.toISOString().split("T")[0];


// -----------------------------
// Generate Forecast Button
// -----------------------------

document.getElementById("generateBtn").onclick = async function(){

    const zone = document.getElementById("zoneSelect").value;
    const date = document.getElementById("forecastDate").value;

    if(zone === "" || date === ""){

        alert("Please select Zone and Forecast Date.");

        return;

    }

    try{

        const response = await fetch("/forecast/generate",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                zone_id:zone,
                forecast_date:date

            })

        });

        const data = await response.json();

        console.log(data);

        // --------------------------
        // TODO
        // Update forecast table
        // --------------------------

        // --------------------------
        // TODO
        // Update chart
        // --------------------------

    }
    catch(error){

        console.log(error);

        alert("Unable to generate forecast.");

    }

};

</script>
    

</body>


</html>
