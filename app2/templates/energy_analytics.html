<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Forecast WebSocket Status</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{

    font-family:Arial,sans-serif;

    background:#f5f5f5;

    margin:0;

    padding:30px;

}

.container{

    width:95%;

    max-width:1200px;

    margin:auto;

}

        #connectionStatus{
            width:250px;
            padding:20px;
            text-align:center;
            font-size:22px;
            font-weight:bold;
            color:white;
            background:red;
            border-radius:10px;
            box-shadow:0 2px 10px rgba(0,0,0,.2);
        }

        table{

    width:100%;

    border-collapse:collapse;

}

th,td{

    border:1px solid #ddd;

    padding:10px;

    text-align:center;

}

th{

    background:#1976d2;

    color:white;

}

    </style>

</head>
  

<body>

    <div class="container">

    <h1>ENERGY ANALYTICS DASHBOARD</h1>

    <div id="connectionStatus">
        Connecting...
    </div>

    <br><br>

    <label><b>Select Zone</b></label>

    <select id="zoneSelect">
        <option value="">Select Zone</option>
        <option value="ZONE_01">ZONE_01</option>
        <option value="ZONE_02">ZONE_02</option>
        <option value="ZONE_03">ZONE_03</option>
        <option value="ZONE_04">ZONE_04</option>
        <option value="ZONE_05">ZONE_05</option>
        <option value="ZONE_06">ZONE_06</option>
        <option value="ZONE_07">ZONE_07</option>
        <option value="ZONE_08">ZONE_08</option>
        <option value="ZONE_09">ZONE_09</option>
        <option value="ZONE_10">ZONE_10</option>
    </select>

    <br><br>

    <label><b>Select Forecast Date</b></label>
<input type="date" id="forecastDate">

<br><br>

<label><b>Start Time</b></label>
<input type="time" id="startTime" step="300">

&nbsp;&nbsp;&nbsp;

<label><b>End Time</b></label>
<input type="time" id="endTime" step="300">

    <br><br>

    <button id="generateBtn">
        Generate Forecast
    </button>

    <br><br>

<table>

<thead>

<tr>

<th>Time</th>
<th>Forecast Power (kW)</th>
<th>Utilization (%)</th>

</tr>

</thead>

<tbody id="forecastTableBody">

<tr>

<td colspan="3">

No Forecast Generated

</td>

</tr>

</tbody>

</table>

    <br><br>

    <canvas
        id="forecastChart"
        width="900"
        height="350">
    </canvas>

</div>


<script>

// ==========================================
// WebSocket Connection
// ==========================================

const status = document.getElementById("connectionStatus");

function connectSocket() {

    status.innerHTML = "🟡 Connecting...";
    status.style.background = "orange";

    const socket = new WebSocket("ws://127.0.0.1:8000/ws/forecast");

    socket.onopen = function () {

        console.log("Forecast WebSocket Connected");

        status.innerHTML = "🟢 Connected";
        status.style.background = "green";

    };

    socket.onmessage = function(event){

        console.log("Received:", event.data);

    };

    socket.onerror = function(error){

        console.log(error);

    };

    socket.onclose = function(){

        status.innerHTML = "🔴 Disconnected";
        status.style.background = "red";

        setTimeout(connectSocket,3000);

    };

}

connectSocket();


// ==========================================
// Date Picker
// ==========================================

const today = new Date();
const maxDate = new Date();

maxDate.setDate(today.getDate()+30);

document.getElementById("forecastDate").min =
today.toISOString().split("T")[0];

document.getElementById("forecastDate").max =
maxDate.toISOString().split("T")[0];






// ==========================================
// Generate Forecast
// ==========================================


document.getElementById("generateBtn").onclick = async function () {

    const zone = document.getElementById("zoneSelect").value;
    const date = document.getElementById("forecastDate").value;
    const start = document.getElementById("startTime").value;
    const end = document.getElementById("endTime").value;

    if (zone === "" || date === "" || start === "" || end === "") {

        alert("Please select Zone, Date, Start Time and End Time.");

        return;

    }

    try {

        const response = await fetch("/forecast/generate", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                zone_id: zone,
                forecast_date: date,
                start_time: start,
                end_time: end

            })

        });

        if (!response.ok) {

            const error = await response.json();

            alert(error.detail);

            return;

        }

        const data = await response.json();

        console.log(data);

        // -----------------------------
        // Update Table
        // -----------------------------

        const tableBody = document.getElementById("forecastTableBody");

        tableBody.innerHTML = "";

        data.forecast.forEach(item => {

            tableBody.innerHTML += `

                <tr>

                    <td>${item.time}</td>

                    <td>${item.predicted_avg_power_kw}</td>

                    <td>${item.utilization_percent}%</td>

                </tr>

            `;

        });

        // -----------------------------
        // Update Chart
        // -----------------------------

        const ctx = document
            .getElementById("forecastChart")
            .getContext("2d");

        if (window.forecastChart) {

            window.forecastChart.destroy();

        }

        window.forecastChart = new Chart(ctx, {

            type: "line",

            data: {

                labels: data.forecast.map(item => item.time),

                datasets: [

                    {

                        label: "Forecast Power (kW)",

                        data: data.forecast.map(item => item.predicted_avg_power_kw),

                        borderColor: "blue",

                        backgroundColor: "rgba(54,162,235,0.2)",

                        fill: true,

                        tension: 0.4,

                        pointRadius: 5

                    }

                ]

            },

            options: {

                responsive: true,

                plugins: {

                    legend: {

                        display: true

                    }

                },

                scales: {

                    x: {

                        title: {

                            display: true,

                            text: "Time"

                        }

                    },

                    y: {

                        title: {

                            display: true,

                            text: "Forecast Power (kW)"

                        }

                    }

                }

            }

        });

    }

    catch (error) {

        console.error(error);

        alert("Unable to generate forecast.");

    }

};

</script>
</body>
</html>
