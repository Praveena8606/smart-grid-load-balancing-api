<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Forecast WebSocket Status</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{

    font-family:Arial,sans-serif;

    background:#f5f5f5;

    margin:0;

    padding:30px;

}

.container{

    width:95%;

    max-width:1200px;

    margin:auto;

}

        #connectionStatus{
            width:250px;
            padding:20px;
            text-align:center;
            font-size:22px;
            font-weight:bold;
            color:white;
            background:red;
            border-radius:10px;
            box-shadow:0 2px 10px rgba(0,0,0,.2);
        }

        table{

    width:100%;

    border-collapse:collapse;

}

th,td{

    border:1px solid #ddd;

    padding:10px;

    text-align:center;

}

th{

    background:#1976d2;

    color:white;

}

    </style>

</head>
  

<body>

    <div class="container">

    <h1>ENERGY ANALYTICS DASHBOARD</h1>

    <div id="connectionStatus">
        Connecting...
    </div>

    <br><br>

    <label><b>Select Zone</b></label>

    <select id="zoneSelect">
        <option value="">Select Zone</option>
        <option value="ZONE_01">ZONE_01</option>
        <option value="ZONE_02">ZONE_02</option>
        <option value="ZONE_03">ZONE_03</option>
        <option value="ZONE_04">ZONE_04</option>
        <option value="ZONE_05">ZONE_05</option>
        <option value="ZONE_06">ZONE_06</option>
        <option value="ZONE_07">ZONE_07</option>
        <option value="ZONE_08">ZONE_08</option>
        <option value="ZONE_09">ZONE_09</option>
        <option value="ZONE_10">ZONE_10</option>
    </select>

    <br><br>

    <label><b>Select Forecast Date</b></label>

    <input type="date" id="forecastDate">

    <br><br>

    <button id="generateBtn">
        Generate Forecast
    </button>

    <br><br>

    <table>

<thead>

<tr>
    <th>Zone</th>
    <th>Forecast Power</th>
    <th>Max</th>
    <th>Min</th>
    <th>House Count</th>
    <th>Utilization</th>
    <th>Date</th>
</tr>

</thead>

<tbody>

<tr id="forecastRow">

<td colspan="7">
No Forecast Generated
</td>

</tr>

</tbody>

</table>

    <br><br>

    <canvas
        id="forecastChart"
        width="900"
        height="350">
    </canvas>

</div>


<script>

// ==========================================
// WebSocket Connection
// ==========================================

const status = document.getElementById("connectionStatus");

function connectSocket() {

    status.innerHTML = "🟡 Connecting...";
    status.style.background = "orange";

    const socket = new WebSocket("ws://127.0.0.1:8000/ws/forecast");

    socket.onopen = function () {

        console.log("Forecast WebSocket Connected");

        status.innerHTML = "🟢 Connected";
        status.style.background = "green";

    };

    socket.onmessage = function(event){

        console.log("Received:", event.data);

    };

    socket.onerror = function(error){

        console.log(error);

    };

    socket.onclose = function(){

        status.innerHTML = "🔴 Disconnected";
        status.style.background = "red";

        setTimeout(connectSocket,3000);

    };

}

connectSocket();


// ==========================================
// Date Picker
// ==========================================

const today = new Date();
const maxDate = new Date();

maxDate.setDate(today.getDate()+30);

document.getElementById("forecastDate").min =
today.toISOString().split("T")[0];

document.getElementById("forecastDate").max =
maxDate.toISOString().split("T")[0];


// ==========================================
// Generate Forecast
// ==========================================

document.getElementById("generateBtn").onclick = async function(){

    const zone =
        document.getElementById("zoneSelect").value;

    const date =
        document.getElementById("forecastDate").value;

    if(zone==="" || date===""){

        alert("Please select Zone and Forecast Date.");

        return;

    }

    try{

        const response = await fetch("/forecast/generate",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                zone_id:zone,

                forecast_date:date

            })

        });

        if(!response.ok){

            const error = await response.json();

            alert(error.detail);

            return;

        }

        const data = await response.json();

        console.log(data);

        // ===========================
        // Update Table
        // ===========================

        document.getElementById("forecastRow").innerHTML = `

            <td>${data.zone_id}</td>

            <td>${data.predicted_power_kw}</td>

            <td>${data.max_power_kw}</td>

            <td>${data.min_power_kw}</td>

            <td>${data.house_count}</td>

            <td>${data.utilization_percent}%</td>

            <td>${data.forecast_date}</td>

        `;


        // ===========================
        // Update Chart
        // ===========================

        const ctx =
            document.getElementById("forecastChart")
            .getContext("2d");

        if(window.forecastChart){

            window.forecastChart.destroy();

        }

        window.forecastChart = new Chart(ctx,{

            type:"line",

            data:{

                labels:data.historical_power.map((_,i)=>`Day ${i+1}`),

                datasets:[

                    {

                        label:"Historical Power",

                        data:data.historical_power,

                        borderColor:"blue",

                        backgroundColor:"transparent",

                        tension:0.4,

                        fill:false

                    },

                    {

                        label:"Forecast",

                        data:[

                            ...new Array(data.historical_power.length-1).fill(null),

                            data.predicted_power_kw

                        ],

                        borderColor:"red",

                        backgroundColor:"transparent",

                        pointRadius:6,

                        pointBackgroundColor:"red",

                        tension:0.4,

                        fill:false

                    }

                ]

            },

            options:{

                responsive:true,

                plugins:{

                    legend:{

                        display:true

                    }

                }

            }

        });

    }

    catch(error){

        console.log(error);

        alert("Unable to generate forecast.");

    }

};

</script>
    

</body>


</html>
