<!DOCTYPE html>
<html>

<head>
    <title>Grid Operator Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="app/dashboard/style.css">
</head>

<body>

<div class="container mt-4">

    <h2 class="text-center mb-4">
        Grid Operator Dashboard
    </h2>

    <div class="row">

        <div class="col-md-3">
            <div class="card dashboard-card">
                <div class="card-body">
                    <h5>Total Records</h5>
                    <h2 id="records">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card dashboard-card">
                <div class="card-body">
                    <h5>Total Zones</h5>
                    <h2 id="zones">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card dashboard-card">
                <div class="card-body">
                    <h5>Current Alerts</h5>
                    <h2 id="alerts">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card dashboard-card">
                <div class="card-body">
                    <h5>Forecast Alerts</h5>
                    <h2 id="forecast_alerts">0</h2>
                </div>
            </div>
        </div>

    </div>

    <hr>

    <h4>Zone Analytics</h4>

    <table class="table table-bordered" id="analyticsTable">

        <thead>
            <tr>
                <th>Zone</th>
                <th>Avg Power</th>
                <th>Voltage</th>
                <th>Current</th>
                <th>Utilization %</th>
            </tr>
        </thead>

        <tbody></tbody>

    </table>

    <hr>

    <h4>Current Alerts</h4>

    <table class="table table-danger" id="alertTable">

        <thead>
            <tr>
                <th>Zone</th>
                <th>Alert</th>
                <th>Time</th>
            </tr>
        </thead>

        <tbody></tbody>

    </table>

</div>

<script src="app/dashboard/app.js"></script>

</body>
</html>
