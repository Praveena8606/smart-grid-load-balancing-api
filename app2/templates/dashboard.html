<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Smart Grid Analytics</title>

    <link rel="stylesheet" href="/static/css/dashboard.css">

</head>

<body>

<div class="container">

    <h1>SMART GRID ANALYTICS PLATFORM</h1>

    <p>Select Dashboard</p>

    <div class="cards">

        <div class="card">

            <h2>Grid Operator</h2>

            <p>
                Real-time visibility into neighborhood
                power consumption.
            </p>

            <button
                onclick="openGridDashboard()">

                Open Dashboard

            </button>

        </div>


        <div class="card">

            <h2>Energy Analytics</h2>

            <p>

                Access historical consumption data
                for forecasting.

            </p>

            <button
                onclick="openAnalyticsDashboard()">

                Open Dashboard

            </button>

        </div>

    </div>

</div>

<script src="/static/js/dashboard.js"></script>

</body>

</html>
